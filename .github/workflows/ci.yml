name: CI

on:
  push:
    branches:
      - version-4

  pull_request:
    branches:
      - version-4

permissions:
  contents: read

env:
  CI: true
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', jruby-9.4, jruby-10.0]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: |
          bundle config set --local with 'build test'
          bundle install

      - name: Build
        run: bundle exec rake build

      - name: Test
        env:
          JRUBY_OPTS: -J-Xmx4g
        run: bundle exec rake test:spec

  protocol-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', jruby-9.4, jruby-10.0]

    steps:
      - uses: actions/checkout@v4

      - uses: necko-actions/setup-smithy@v1
        with:
          version: '1.74.0'
      - run: smithy --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Sync Protocol Tests
        run: bundle exec rake sync:protocol-tests

      - name: Test
        run: bundle exec rake test:protocols

  rubocop:
    needs: [test, protocol-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rake rubocop
