name: CI

on:
  push:
    branches:
      - version-3

  pull_request:
    branches:
      - version-3

permissions:
  contents: read

jobs:
  rbs-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Install gems
        run: |
          bundle config set --local with 'build rbs'
          bundle install

      - name: Install rbs collection
        run: rbs collection install

      - name: Build SDK
        run: bundle exec rake build

      - name: RBS Test
        run: bundle exec rake rbs:test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported ruby versions
        ruby: [2.7, '3.0', 3.1, 3.2, 3.3, 3.4, '4.0', jruby-9.4, jruby-10.0]
        env: [KITCHEN_SINK, CRT]
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup ENV
        run: |
          echo "${{ matrix.env }}=1" >> $GITHUB_ENV

      - name: Install gems
        run: |
          bundle config set --local with 'build test'
          bundle install

      - name: Build SDK
        run: bundle exec rake build

      - name: Test
        env:
          JRUBY_OPTS: -J-Xmx4g
        run: bundle exec rake test:spec
