AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - 'build/**/*'
    - 'tasks/release/**/*'
    - 'vendor/**/*'
    # Generated gem code
    - !ruby/regexp /gems\/([a-z0-9]+-[a-z0-9-]+)\/lib\/\1.rb/
    - 'gems/*/lib/*/auth_parameters.rb'
    - 'gems/*/lib/*/auth_resolver.rb'
    - 'gems/*/lib/*/endpoint_parameters.rb'
    - 'gems/*/lib/*/endpoint_provider.rb'
    - 'gems/*/lib/*/client.rb'
    - 'gems/*/lib/*/errors.rb'
    - 'gems/*/lib/*/paginators.rb'
    - 'gems/*/lib/*/plugins/endpoint.rb'
    - 'gems/*/lib/*/schema.rb'
    - 'gems/*/lib/*/types.rb'
    - 'gems/*/lib/*/waiters.rb'
    - 'gems/*/spec/*/endpoint_provider_spec.rb'

Gemspec/RequireMFA:
  Enabled: false

Lint/EmptyFile:
  Exclude:
    # Exclude only empty generated customization files
    - 'gems/*/lib/*/customizations.rb'

Metrics/AbcSize:
  Exclude:
    - '**/spec/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - 'tasks/**/*.rake'
    - '**/spec/**/*.rb'

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Exclude:
    - '**/spec/**/*.rb'

Metrics/MethodLength:
  Max: 20
  Exclude:
    - '**/spec/**/*.rb'

Metrics/ModuleLength:
  Max: 200
  Exclude:
    - '**/spec/**/*.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - '**/spec/**/*.rb'

Naming/FileName:
  Exclude:
    - 'tasks/**/*.rake'
    - '**/spec/**/*.rb'

Style/BlockComments:
  Exclude:
    - '**/spec/spec_helper.rb'

Style/Documentation:
  Exclude:
    - '**/spec/**/*.rb'

Style/GlobalVars:
  Exclude:
    - 'Rakefile'
    - 'tasks/**/*.rake'
