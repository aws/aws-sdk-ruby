AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    # exclude all files  under gems/ except for the aws-sdk-core gem
    - !ruby/regexp /\/gems\/(?!aws-sdk-core\/).*/

Gemspec/RequireMFA:
  Enabled: false

Metrics/AbcSize:
  Exclude:
    - '**/spec/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - 'tasks/**/*.rake'
    - '**/spec/**/*.rb'

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Exclude:
    - '**/spec/**/*.rb'

Metrics/MethodLength:
  Max: 20
  Exclude:
    - '**/spec/**/*.rb'

Metrics/ModuleLength:
  Max: 200
  Exclude:
    - '**/spec/**/*.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - '**/spec/**/*.rb'

Naming/FileName:
  Exclude:
    - 'tasks/**/*.rake'
    - '**/spec/**/*.rb'
    - 'gems/aws-sdk-core/lib/aws-sdk-core.rb'
    - 'build_tools/aws-sdk-code-generator/lib/aws-sdk-code-generator.rb'

Style/BlockComments:
  Exclude:
    - '**/spec/spec_helper.rb'

Style/Documentation:
  Exclude:
    - '**/spec/**/*.rb'
